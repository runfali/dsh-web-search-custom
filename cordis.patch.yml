# dsh-web-search-custom bundle patch
#
# 安装（标准 bundle 插件，不改 dsh 源码）：
#   dsh plugin --profile web add dsh-web-search-custom      # or: add /path/to/this/checkout
# 卸载：
#   dsh plugin --profile web remove dsh-web-search-custom
# 安装/卸载后重启 dsh 生效。
#
# 本补丁做两件事：
#   1. 把 host 层 web 服务的搜索 provider 固定为 custom；
#   2. 挂载本插件的 provider 行，出厂默认指向 AnySearch 统一搜索入口
#      https://api.anysearch.com/v1/search（api: auto → 识别为 anysearch 档）。
#
# 免 key / 带 key 两态（由 apiKey 是否为空决定，凭据永远只在本机）：
#   apiKey: ''          → 匿名免费档：请求完全不发 Authorization 头，走按 IP 限流的每日免费额度
#   apiKey: 'sk-xxxx'   → 鉴权档：发送 Authorization: Bearer sk-xxxx，走该 key 的付费配额
#
# 档位（api 字段）：auto（默认，按 URL 主机名判定）| anysearch | generic。
#   anysearch 档：POST + {"query","max_results"}，响应取 data.results[].{title,url,snippet|content}。
#                 只认 url / apiKey / headers / timeoutMs / maxResults 五个字段。
#   generic 档（SearXNG 等任意 JSON 接口）：GET/POST 模板、authHeader/authScheme、
#                 点路径字段映射、{query}/{queryRaw}/{apiKey} 占位符。
#
# 需要 AnySearch 的 tag/params/zone/language（垂直检索）时，用 api: generic + body 模板表达，
# 例如 body: '{"query":"{queryRaw}","tag":"code.doc","params":{"library":"golang"},"max_results":5}'
#
# To change the endpoint or key, override in your profile's user layer
# (~/.dsh/profile/web/cordis.patch.yml) or fill it in the Settings → Plugins card.
# A patch replaces the whole config block, so write every key when overriding:
- id: web
  config:
    searchProvider: custom

- insert:
    - id: web-search-custom
      name: 'dsh-web-search-custom'
      config:
        api: auto
        url: 'https://api.anysearch.com/v1/search'
        apiKey: ''
        maxResults: 10
        method: GET
        body: '{"query":"{query}"}'
        headers: '{}'
        authHeader: Authorization
        authScheme: Bearer
        timeoutMs: 30000
        resultsPath: results
        urlField: url
        titleField: title
        snippetField: content
        publishedField: publishedDate
