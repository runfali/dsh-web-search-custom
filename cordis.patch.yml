# dsh-web-search-custom bundle patch
#
# 安装（标准 bundle 插件，不改 dsh 源码）：
#   dsh plugin --profile web add /data/dsh-workspace/dsh-web-search-custom
# 卸载：
#   dsh plugin --profile web remove dsh-web-search-custom
# 安装/卸载后重启 dsh 生效。
#
# 本补丁做两件事：
#   1. 把 host 层 web 服务的搜索 provider 固定为 custom；
#   2. 挂载本插件的 provider 行，默认指向本机 SearXNG
#      http://127.0.0.1:8080/search?format=json&q={query}（无需 key）。
#
# url 支持 {query} / {apiKey} 占位符；不带 {query} 时自动追加 q= 参数。
# apiKey 为空则不发鉴权头；非空时默认以 "Authorization: Bearer <key>" 发送，
# 除非 url 或 POST body 里已出现 {apiKey}。
#
# 如要改地址/key，在 profile 的用户层（~/.dsh/profiles/web/cordis.patch.yml）
# 追加覆盖（补丁整段替换 config，覆盖时要写全所有项）：
#   - id: web-search-custom
#     config:
#       url: 'http://127.0.0.1:8080/search?format=json&q={query}'
#       apiKey: ''
#       method: GET
#       body: '{"query":"{query}"}'
#       headers: '{}'
#       authHeader: Authorization
#       authScheme: Bearer
#       timeoutMs: 30000
#       resultsPath: results
#       urlField: url
#       titleField: title
#       snippetField: content
#       publishedField: publishedDate
- id: web
  config:
    searchProvider: custom

- insert:
    - id: web-search-custom
      name: 'dsh-web-search-custom'
      config:
        url: 'http://127.0.0.1:8080/search?format=json&q={query}'
        apiKey: ''
        method: GET
        body: '{"query":"{query}"}'
        headers: '{}'
        authHeader: Authorization
        authScheme: Bearer
        timeoutMs: 30000
        resultsPath: results
        urlField: url
        titleField: title
        snippetField: content
        publishedField: publishedDate
